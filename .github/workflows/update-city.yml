name: 更新我这边的城市

# 1. iPhone 捷径自动调用（repository_dispatch，带 lat / lon）
# 2. 在 GitHub App 里手动运行，输入城市名；输入「隐藏」关闭小卡
on:
  repository_dispatch:
    types: [update-city]
  workflow_dispatch:
    inputs:
      city:
        description: "城市名（如 上海）；输入「隐藏」关闭小卡"
        required: true

concurrency:
  group: update-city
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.city.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - name: 换算成城市
        id: city
        env:
          LAT: ${{ github.event.client_payload.lat }}
          LON: ${{ github.event.client_payload.lon }}
          CITY: ${{ github.event.inputs.city || github.event.client_payload.city }}
        run: python3 scripts/update_city.py
      - name: 保存
        if: steps.city.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partner.json
          git commit -m "chore: 更新我这边的城市"
          git push

  # 机器人提交不会触发 pages.yml，所以这里自己部署
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
