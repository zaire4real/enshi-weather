name: daily-enshi-snapshot
on:
  schedule:
    - cron: '47 22 * * *'   # 北京 06:47
    - cron: '0 10 * * *'    # 北京 18:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch & update snapshot
        run: python3 scripts/update_snapshot.py
      - name: Commit & push if changed
        run: |
          git config user.name "enshi-bot"
          git config user.email "enshi-bot@users.noreply.github.com"
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "chore(snapshot): daily update $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes."
          fi
